name: CI gate

# Runs every example's tuvl CI gate offline (no database or model keys needed).
# tuvl 2.0 comes from PyPI.
# Work happens on develop; main only takes a pull request from develop.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - sentiment-api
          - invoice-extraction-api
          - concierge-chat
          - knowledge-base-qa
          - batch-screening
          - document-intake
          - content-moderation-pipeline
          - support-triage
          - mcp-research-agent
          - kyc-onboarding
          - prior-authorization
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install tuvl
        run: uv tool install --python 3.13 "tuvl[standard]>=2.0.1,<3"
      - name: Gate
        run: |
          tuvl lint spec
          tuvl lint project --strict
          tuvl generate code --check
          tuvl verify lock --no-mcp
          tuvl run tests --strict
          tuvl verify spec --strict
          tuvl list tasks --strict
          tuvl review code --strict

  # one check that stands for all of them, so branch rules need not list each example
  all-examples:
    name: All examples pass the gate
    if: always()
    needs: gate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every example passed
        env:
          RESULT: ${{ needs.gate.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::the gate did not pass for every example ($RESULT)"
            exit 1
          fi

  branch-flow:
    name: main takes pull requests from develop only
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REF" != "develop" || "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::main only takes pull requests from develop; open this one against develop"
            exit 1
          fi

  # a push to main must be a release merged from develop (branch rules block the rest)
  main-from-develop:
    name: main only contains develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the pushed commit came from develop
        run: |
          git fetch --no-tags origin develop
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then exit 0; fi # fast-forward from develop
          SECOND=$(git rev-parse --verify --quiet "$GITHUB_SHA^2" || true) # merge commit of develop
          if [[ -n "$SECOND" ]] && git merge-base --is-ancestor "$SECOND" origin/develop; then exit 0; fi
          echo "::error::$GITHUB_SHA was pushed to main without coming from develop"
          exit 1
