# tuvl 2.0 — classify a product review's sentiment and persist it.
# One bounded LLM agent, one deterministic database agent.
kind: Workflow
version: tuvl/v2
metadata:
  name: analyze_sentiment
  description: Classify a product review's sentiment and persist the result.
  tags: [reviews]
spec:
  models: [Review]
  trigger:
    http: { path: /api/reviews/analyze, method: POST }
    input:
      text: str
      source: str?

  agents:
    - id: classify
      description: Classify the sentiment of a product review
      engine: llm
      inputs:
        text: str
      outputs:
        sentiment: enum[positive, neutral, negative]
        confidence: float
      budget:
        timeout: 60s
        max_tokens: 1000
        retry: { attempts: 2, errors: [parse_error, timeout], backoff: 2 }
      llm:
        model: default
        system: |
          You are a precise sentiment classifier. Base the judgement solely on
          the review text. Confidence is a number between 0 and 1.
        prompt: Classify the sentiment of this product review.
      routes:
        default: persist
        parse_error: END.failed
        timeout: END.failed
        budget_exceeded: END.failed
        error: END.failed

    - id: persist
      description: Store the review with its classified sentiment
      engine: tool
      inputs:
        text: str
        source: str?
        sentiment: enum[positive, neutral, negative]
        confidence: float
      outputs:
        review: Review
      tool:
        use: db
        model: Review
        op: create
        values:
          text: "{{ text }}"
          source: "{{ source }}"
          sentiment: "{{ sentiment }}"
          confidence: "{{ confidence }}"
      routes:
        default: END
        conflict: END.failed
        error: END.failed

  outputs:
    default:
      status: 200
      body:
        id: "{{ review.id }}"
        sentiment: "{{ review.sentiment }}"
        confidence: "{{ review.confidence }}"
        source: "{{ review.source }}"
    failed:
      status: 502
      body: { error: sentiment analysis failed }
