# tuvl 2.0 — answer a question from kb_docs, citing the sources used.
# Hybrid retrieval (vector + full-text, RRF) → a grounded, structured answer.
kind: Workflow
version: tuvl/v2
metadata:
  name: ask_kb
  description: Retrieve grounding passages from kb_docs and answer, citing sources.
  tags: [knowledge-base]
spec:
  trigger:
    http: { path: /api/kb/ask, method: POST }
    input:
      question: str

  agents:
    - id: search
      description: Find the passages most relevant to the question
      engine: code
      effect: read
      inputs: { question: str }
      outputs: { passages: "list[json]" }     # [{content, metadata, score}]
      code:
        run: tuvl.data_search
        with: { collection: kb_docs, query: "{{ question }}", top_k: 5 }
      routes:
        default: answer
        error: END.failed

    - id: answer
      description: Answer strictly from the retrieved passages
      engine: llm
      inputs: { question: str, passages: "list[json]" }
      outputs:
        answer: str
        sources: list[str]
        confident: bool
      budget:
        timeout: 30s
        max_tokens: 1000
        retry: { attempts: 2, errors: [parse_error, timeout], backoff: 2 }
      llm:
        model: default
        system: |
          You answer questions strictly from the provided knowledge-base passages.
          - Use ONLY the passages. Never rely on outside knowledge.
          - In `sources`, list the metadata `title` of every passage you used.
          - If the passages do not contain the answer, set answer to exactly
            "not in the knowledge base", sources to [], and confident to false.
            Never invent a citation.
        prompt: Answer the question from the passages.
      routes:
        default: END
        parse_error: END.failed
        timeout: END.failed
        budget_exceeded: END.failed
        error: END.failed

  outputs:
    default:
      status: 200
      body: { answer: "{{ answer }}", sources: "{{ sources }}", confident: "{{ confident }}" }
    failed:
      status: 502
      body: { error: the question could not be answered }
