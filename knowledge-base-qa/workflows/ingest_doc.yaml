# tuvl 2.0 — embed a markdown document into the kb_docs vector store.
kind: Workflow
version: tuvl/v2
metadata:
  name: ingest_doc
  description: Embed a markdown document and persist it to the kb_docs vector store.
  tags: [knowledge-base]
spec:
  trigger:
    http: { path: /api/kb/ingest, method: POST }
    input:
      title: str
      content: str
      tags: list[str]?

  agents:
    - id: ingest
      description: Embed the document and store it in kb_docs
      engine: code
      inputs: { title: str, content: str, tags: "list[str]?" }
      outputs: { doc_id: uuid }
      code:
        run: tuvl.data_ingest
        with:
          collection: kb_docs
          document: "{{ content }}"
          metadata: { title: "{{ title }}", tags: "{{ tags }}" }
      routes:
        default: END
        error: END.failed

  outputs:
    default:
      status: 201
      body: { doc_id: "{{ doc_id }}", title: "{{ title }}" }
    failed:
      status: 502
      body: { error: the document could not be ingested }
