# tuvl 2.0 — extract, verify and persist a structured invoice from raw text.
# LLM extraction → deterministic verification → database write.
kind: Workflow
version: tuvl/v2
metadata:
  name: extract_invoice
  description: Extract, verify, and persist a structured invoice from raw text.
  tags: [invoices]
spec:
  models: [Invoice]
  trigger:
    http: { path: /api/invoices/extract, method: POST }
    input:
      raw_text: str

  agents:
    - id: extract
      description: Extract structured invoice fields from raw invoice text
      engine: llm
      inputs:
        raw_text: str
      outputs:                       # null when a field is genuinely absent
        vendor_name: str?
        invoice_number: str?
        invoice_date: date?
        currency: enum[USD, EUR, GBP, INR]?
        subtotal: float?
        tax: float?
        total: float?
        vendor_tax_id: str?
      budget:
        timeout: 60s
        max_tokens: 2000
        retry: { attempts: 2, errors: [parse_error, timeout], backoff: 2 }
      llm:
        model: default
        system: |
          You are a precise invoice data extractor. You never invent values;
          use null for any field that is absent from the input.
        prompt: Extract the structured invoice fields from this invoice text.
      routes:
        default: verify_totals
        parse_error: END.failed
        timeout: END.failed
        budget_exceeded: END.failed
        error: END.failed

    - id: verify_totals
      description: Check required fields are present and subtotal + tax equals total
      engine: code
      effect: read
      inputs:
        vendor_name: str?
        invoice_number: str?
        invoice_date: date?
        currency: enum[USD, EUR, GBP, INR]?
        subtotal: float?
        tax: float?
        total: float?
        vendor_tax_id: str?
        raw_text: str
      outputs:                       # per signal: no invoice when incomplete
        valid:
          invoice: Invoice.create
          verification: json
        mismatch:
          invoice: Invoice.create
          verification: json
        incomplete:
          verification: json
      code: { run: verify_totals }
      routes:
        valid: persist
        mismatch: persist_rejected
        incomplete: END.failed
        error: END.failed

    - id: persist
      description: Store a verified invoice
      engine: tool
      inputs:
        invoice: Invoice.create
      outputs:
        saved: Invoice
      tool:
        use: db
        model: Invoice
        op: create
        values:
          vendor_name: "{{ invoice.vendor_name }}"
          invoice_number: "{{ invoice.invoice_number }}"
          invoice_date: "{{ invoice.invoice_date }}"
          currency: "{{ invoice.currency }}"
          subtotal: "{{ invoice.subtotal }}"
          tax: "{{ invoice.tax }}"
          total: "{{ invoice.total }}"
          vendor_tax_id: "{{ invoice.vendor_tax_id }}"
          raw_text: "{{ invoice.raw_text }}"
          status: extracted
      routes:
        default: END
        conflict: END.duplicate
        error: END.failed

    - id: persist_rejected
      description: Store an invoice whose totals do not add up, marked rejected
      engine: tool
      inputs:
        invoice: Invoice.create
      outputs:
        rejected: Invoice
      tool:
        use: db
        model: Invoice
        op: create
        values:
          vendor_name: "{{ invoice.vendor_name }}"
          invoice_number: "{{ invoice.invoice_number }}"
          invoice_date: "{{ invoice.invoice_date }}"
          currency: "{{ invoice.currency }}"
          subtotal: "{{ invoice.subtotal }}"
          tax: "{{ invoice.tax }}"
          total: "{{ invoice.total }}"
          vendor_tax_id: "{{ invoice.vendor_tax_id }}"
          raw_text: "{{ invoice.raw_text }}"
          status: rejected
      routes:
        default: END.rejected
        conflict: END.duplicate
        error: END.failed

  outputs:
    default:
      status: 200
      body:
        id: "{{ saved.id }}"
        vendor_name: "{{ saved.vendor_name }}"
        invoice_number: "{{ saved.invoice_number }}"
        currency: "{{ saved.currency }}"
        total: "{{ saved.total }}"
        status: "{{ saved.status }}"
    rejected:
      status: 200
      body:
        id: "{{ rejected.id }}"
        invoice_number: "{{ rejected.invoice_number }}"
        total: "{{ rejected.total }}"
        status: "{{ rejected.status }}"
        verification: "{{ verification }}"
    duplicate:
      status: 409
      body: { error: an invoice with this number already exists }
    failed:
      status: 422
      body: { error: the invoice could not be extracted or verified }
