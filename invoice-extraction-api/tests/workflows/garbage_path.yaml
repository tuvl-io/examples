# Not an invoice: nothing extracted, nothing persisted, a clean 422.
kind: Test
version: tuvl/v2
metadata: { name: garbage-path }
spec:
  workflow: extract_invoice
  input:
    raw_text: "###### not an invoice — random bytes ######"
  mocks:
    extract:
      outputs:
        vendor_name: null
        invoice_number: null
        invoice_date: null
        currency: null
        subtotal: null
        tax: null
        total: null
        vendor_tax_id: null
  expect:
    end: failed
    path: [extract, verify_totals]
    output: { status: 422 }
