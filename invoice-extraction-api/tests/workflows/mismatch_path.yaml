# Doctored totals: verification fails on arithmetic, the record is stored as rejected.
kind: Test
version: tuvl/v2
metadata: { name: mismatch-path }
spec:
  workflow: extract_invoice
  input:
    raw_text: |
      ACME CORP
      Invoice #INV-2002
      Date: 2026-06-02
      Subtotal: 100.00 USD
      Tax: 8.50 USD
      Total: 200.00 USD
  mocks:
    extract:
      outputs:
        vendor_name: Acme Corp
        invoice_number: INV-2002
        invoice_date: "2026-06-02"
        currency: USD
        subtotal: 100.00
        tax: 8.50
        total: 200.00
        vendor_tax_id: null
    persist_rejected:
      outputs:
        rejected:
          id: 22222222-2222-2222-2222-222222222222
          vendor_name: Acme Corp
          invoice_number: INV-2002
          currency: USD
          subtotal: 100.00
          tax: 8.50
          total: 200.00
          status: rejected
  expect:
    end: rejected
    path: [extract, verify_totals, persist_rejected]
    output: { status: 200, body: { status: rejected, invoice_number: INV-2002 } }
    assertions:
      - "output.body.verification.ok == false"
