# tuvl 2.0 — seed the compliance_policies RAG collection (admin only).
kind: Workflow
version: tuvl/v2
metadata:
  name: ingest_policy
  description: Ingest a compliance policy document into the compliance_policies RAG collection.
  tags: [kyc]
  required_scope: iam:admin
spec:
  trigger:
    http: { path: /api/kyc/policies, method: POST }
    input:
      title: str
      content: str

  agents:
    - id: ingest
      description: Embed the policy and store it in compliance_policies
      engine: code
      inputs: { title: str, content: str }
      outputs: { doc_id: uuid }
      code:
        run: tuvl.data_ingest
        with:
          collection: compliance_policies
          document: "{{ content }}"
          metadata: { title: "{{ title }}", source: compliance_policy }
      routes:
        default: END
        error: END.failed

  outputs:
    default:
      status: 201
      body: { doc_id: "{{ doc_id }}", title: "{{ title }}" }
    failed:
      status: 502
      body: { error: the policy could not be ingested }
