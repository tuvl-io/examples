kind: Workflow
version: v1
metadata:
  name: ingest_policy
  schema_version: v1
  description: Ingest a compliance policy document into the compliance_policies RAG collection.
  group: kyc
  required_scope: iam:admin        # admin-only: seeding the policy corpus
enabled: true
spec:
  trigger:
    path: /api/kyc/policies
    method: POST
    input_schema:
      - { name: title, type: string, required: true }
      - { name: content, type: string, required: true }
  steps:
    - id: ingest
      kind: Functional
      runner: DataIngest
      collection: compliance_policies
      scope: global
      document: "{{ content }}"
      metadata:
        title: "{{ title }}"
        source: compliance_policy
      routes:
        default: respond
        error: respond

    - id: respond
      kind: Response
      # Mapping resolves context dot-paths (no literals). Echo the ingested
      # title back as confirmation; `_last_error` is null on success and
      # carries the reason on the error branch.
      mapping:
        title: title
        error: _last_error
      routes:
        default: END
