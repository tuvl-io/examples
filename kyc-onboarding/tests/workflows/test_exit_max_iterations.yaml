# Reserved exit max_iterations -> hitl_review (never auto-clear on a cap hit).
workflow: onboard_applicant
input:
  full_name: "Eve MaxIter"
  dob: "1988-08-08"
  national_id: "EV-5005"
  email: "eve@example.com"
  country: de
stubs:
  - step_id: persist_applicant
    mock_output: { applicant_record: { id: "00000000-0000-0000-0000-000000000005", status: received } }
  - step_id: sanctions_screen
    mock_output: { screening_result: { status: clean }, screening_echo: de }
  - step_id: policy_context
    mock_output:
      policies:
        - { content: "Policy 03 — banding requires a completed investigation.", score: 0.6 }
  - step_id: investigate
    mock_output:
      investigation: { outcome: null, summary: "Iteration cap reached." }
      _signal: max_iterations
  - step_id: hitl_review
    mock_output:
      compliance_decision: { decision: reject, band: high, note: "Agent could not conclude within the cap." }
  - step_id: persist_assessment
    mock_output: { assessment_record: { id: "00000000-0000-0000-0000-0000000000e2" } }
  - step_id: update_applicant
    mock_output: { applicant_updated: { id: "00000000-0000-0000-0000-000000000005", status: rejected } }
evaluations:
  - step_id: respond
    instruction: >-
      The iteration cap routed the run to human review and the reviewer
      rejected. decision_status must equal "rejected" in the step context.
