# Reserved exit error -> respond_failed (the only non-human failure branch).
workflow: onboard_applicant
input:
  full_name: "Grace Error"
  dob: "1999-11-11"
  national_id: "GR-7007"
  email: "grace@example.com"
  country: gb
stubs:
  - step_id: persist_applicant
    mock_output: { applicant_record: { id: "00000000-0000-0000-0000-000000000007", status: received } }
  - step_id: sanctions_screen
    mock_output: { screening_result: { status: clean }, screening_echo: gb }
  - step_id: policy_context
    mock_output:
      policies:
        - { content: "Policy 01 — screening context.", score: 0.5 }
  - step_id: investigate
    mock_output:
      investigation: null
      _last_error: "LLM call failed"
      _signal: error
evaluations:
  - step_id: respond_failed
    instruction: >-
      The agent errored, so the run took the respond_failed branch rather than
      any approval path. Pass if this step (respond_failed) executed — i.e. the
      error routed to the failure response, not to a human approval or auto path.
