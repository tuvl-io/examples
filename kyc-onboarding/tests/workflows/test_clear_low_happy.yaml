# Happy path: investigate -> clear, assess -> low band, auto-approved without
# suspension. The agent loop, screening, RAG and persistence are stubbed; the
# real Router (route_band) and the real apply_decision node run, so this
# exercises the auto-approve branch deterministically.
workflow: onboard_applicant
input:
  full_name: "Alice Benign"
  dob: "1990-01-01"
  national_id: "AL-1001"
  email: "alice@example.com"
  country: us
stubs:
  - step_id: persist_applicant
    mock_output:
      applicant_record: { id: "00000000-0000-0000-0000-000000000001", status: received }
  - step_id: sanctions_screen
    mock_output:
      screening_result: { status: clean }
      screening_echo: us
  - step_id: policy_context
    mock_output:
      policies:
        - { content: "Policy 03 — low band may be auto-approved when screening is clean.", score: 0.9 }
  - step_id: investigate
    mock_output:
      investigation: { outcome: clear, summary: "Clean watchlist and screening.", watchlist_hit: false }
      _signal: clear
  - step_id: assess
    mock_output:
      assessment:
        score: 12
        band: low
        rationale: "Low risk: clean sanctions screen and a Standard jurisdiction per Policy 02, eligible for auto-approval under Policy 03."
  - step_id: persist_assessment
    mock_output:
      assessment_record: { id: "00000000-0000-0000-0000-0000000000a2" }
  - step_id: update_applicant
    mock_output:
      applicant_updated: { id: "00000000-0000-0000-0000-000000000001", status: approved }
evaluations:
  - step_id: respond
    instruction: >-
      In the step context, decision_status must equal "approved" and
      decision_band must equal "low" (the low-band applicant was auto-approved
      with no human review). Pass only if both hold.
