# Reserved exit budget_exceeded -> hitl_review (token budget hit -> human).
workflow: onboard_applicant
input:
  full_name: "Frank Budget"
  dob: "1975-03-03"
  national_id: "FR-6006"
  email: "frank@example.com"
  country: us
stubs:
  - step_id: persist_applicant
    mock_output: { applicant_record: { id: "00000000-0000-0000-0000-000000000006", status: received } }
  - step_id: sanctions_screen
    mock_output: { screening_result: { status: clean }, screening_echo: us }
  - step_id: policy_context
    mock_output:
      policies:
        - { content: "Policy 01 — incomplete screening must go to a human.", score: 0.65 }
  - step_id: investigate
    mock_output:
      investigation: { outcome: null, summary: "Token budget exceeded." }
      _signal: budget_exceeded
  - step_id: hitl_review
    mock_output:
      compliance_decision: { decision: approve, band: medium, note: "Reviewed manually after budget exit." }
  - step_id: persist_assessment
    mock_output: { assessment_record: { id: "00000000-0000-0000-0000-0000000000f2" } }
  - step_id: update_applicant
    mock_output: { applicant_updated: { id: "00000000-0000-0000-0000-000000000006", status: approved } }
evaluations:
  - step_id: respond
    instruction: >-
      The token-budget exit routed to human review and the reviewer approved at
      band "medium". decision_status must equal "approved" and decision_band
      must equal "medium".
