kind: ModelDefinition
enabled: true
metadata:
  name: Digest
  schema_version: v1
  description: A written summary of the most recent documents.
spec:
  tablename: digests
  fields:
    - { name: id, type: uuid, primary_key: true, default: uuid4, input: false }
    - { name: document_count, type: integer, required: true }
    - { name: headline, type: string, required: true }
    - { name: body, type: text, required: true }
    - { name: created_at, type: timestamptz, input: false }
