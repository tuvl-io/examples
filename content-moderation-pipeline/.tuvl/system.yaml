# tuvl system configuration
# Generated by `tuvl init`. Do not edit deployment_mode after first boot
# — the database lock takes precedence and a mismatch will crash startup.
#
# deployment_mode:
#   single_tenant  — all data shared in a single schema (default)
#   multi_tenant   — tenant_id column injected into every model;
#                    Row-Level Security policies enforced per request
kind: SystemConfig
version: v1
metadata:
  name: system
spec:
  deployment_mode: single_tenant
