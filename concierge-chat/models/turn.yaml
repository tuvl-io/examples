kind: ModelDefinition
enabled: true
metadata:
  name: Turn
  schema_version: v1
  description: One message from a traveller and the concierge's reply.
spec:
  tablename: turns
  fields:
    - { name: id, type: uuid, primary_key: true, default: uuid4, input: false }
    - { name: message, type: text, required: true }
    - { name: reply, type: text, required: true }
    - { name: created_at, type: timestamptz, input: false }
