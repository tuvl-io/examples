kind: AgentModel
version: v1
enabled: true
metadata:
  name: default
  description: >
    Local, tool-capable chat model shared by both agent steps. llama3.1 supports
    native tool-calling, which the autonomous `investigate` step requires.
spec:
  # Runs fully locally via Ollama — no cloud API key needed.
  #   ollama pull llama3.1:latest   (start Ollama first: `ollama serve`)
  model: ollama_chat/llama3.1:latest
  temperature: 0.1

  # ── Prefer a hosted model? Swap the two lines above for a LiteLLM string ──
  # and set the matching key in .env (see .env.example). The model MUST support
  # tool-calling for the autonomous step.
  #   provider: gemini
  #   model: gemini/gemini-3.1-flash-lite
  #   api_key: ${GEMINI_API_KEY}
