kind: DataSource
version: v1
enabled: true
metadata:
  name: main_postgres
  primary: true
spec:
  type: postgres
  connection:
    host: ${POSTGRES_HOST:localhost}
    port: ${POSTGRES_PORT:5432}
    database: ${POSTGRES_DB:tuvl_support}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
