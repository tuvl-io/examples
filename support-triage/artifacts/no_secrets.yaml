kind: Artifact
version: v1
enabled: true
metadata:
  name: no-secrets
  description: Output guardrail — the reply must not leak internal identifiers.
spec:
  type: guardrail
  checks:
    - check: regex_deny
      patterns:
        - "(?i)internal[_-]?ref"
        - "sk-[A-Za-z0-9]{8,}"
    - check: max_chars
      limit: 4000
