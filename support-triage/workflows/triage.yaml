# tuvl 2.0 — classify a support ticket; billing tickets get an investigator.
#
# `investigate` is an autonomous investigator (a `loop` agent with the
# lookup_account tool and an output guardrail). Loops arrive in tuvl 2.0
# phase 2, so it runs as a `pending` contract stub until then. `route` becomes
# a `decide` rule (category == 'billing') when decide lands.
kind: Workflow
version: tuvl/v2
metadata:
  name: triage
  description: Classify a support ticket, then investigate billing ones.
spec:
  models: [SupportTicket]
  trigger:
    http: { path: /support/triage, method: POST }
    input:
      customer_id: str
      subject: str
      body: str

  agents:
    - id: classify
      description: Classify the ticket's category and urgency
      engine: llm
      inputs: { subject: str, body: str }
      outputs:
        category: "enum[billing, technical, account]"
        urgency: "enum[low, medium, high]"
      budget:
        timeout: 60s
        max_tokens: 300
        retry: { attempts: 2, errors: [parse_error, timeout] }
      llm:
        model: default
        system: artifact://triage-prompt@1
        prompt: Classify this ticket.
      routes:
        default: route
        parse_error: END.failed
        timeout: END.failed
        budget_exceeded: END.failed
        error: END.failed

    - id: route
      description: Send billing tickets to the investigator, the rest straight to storage
      engine: code
      effect: read
      code: { run: route_by_category }
      inputs: { category: "enum[billing, technical, account]" }
      routes:
        investigate: investigate
        store: persist
        error: END.failed

    - id: investigate
      description: Investigate a billing issue with the account lookup tool
      engine: pending                     # becomes `engine: loop` in phase 2
      inputs: { customer_id: str, subject: str, body: str }
      outputs: { resolution: str }
      routes:
        resolved: persist
        needs_human: persist

    - id: persist
      description: Save the triaged ticket
      engine: tool
      inputs:
        subject: str
        body: str
        category: "enum[billing, technical, account]"
        urgency: "enum[low, medium, high]"
        resolution: str?
      outputs: { ticket: SupportTicket }
      tool:
        use: db
        model: SupportTicket
        op: create
        values:
          subject: "{{ subject }}"
          body: "{{ body }}"
          category: "{{ category }}"
          urgency: "{{ urgency }}"
          resolution: "{{ resolution }}"
      routes:
        default: END
        conflict: END.failed
        error: END.failed

  outputs:
    default:
      status: 201
      body:
        ticket_id: "{{ ticket.id }}"
        category: "{{ ticket.category }}"
        urgency: "{{ ticket.urgency }}"
        resolution: "{{ ticket.resolution }}"
    failed:
      status: 502
      body: { error: the ticket could not be triaged }
