# tuvl 2.0 — classify a support ticket, decide where it goes, and let an
# investigator resolve billing problems (crediting the customer, with a team
# lead's approval above 50).
#
#   classify (llm) → route (decide: rules first, then a decision model)
#     investigate → investigate (loop: lookup_account, issue_credit) → persist
#     store       → persist
kind: Workflow
version: tuvl/v2
metadata:
  name: triage
  description: Classify a support ticket, route it, and investigate billing ones.
spec:
  models: [SupportTicket]
  trigger:
    http: { path: /support/triage, method: POST }
    input:
      customer_id: str
      subject: str
      body: str

  agents:
    - id: classify
      description: Classify the ticket's category and urgency
      engine: llm
      inputs: { subject: str, body: str }
      outputs:
        category: "enum[billing, technical, account]"
        urgency: "enum[low, medium, high]"
      budget:
        timeout: 60s
        max_tokens: 300
        retry: { attempts: 2, errors: [parse_error, timeout] }
      llm:
        model: default
        system: artifact://triage-prompt@1
        prompt: Classify this ticket.
      routes:
        default: route
        parse_error: END.failed
        timeout: END.failed
        budget_exceeded: END.failed
        error: END.failed

    - id: route
      description: Decide whether the ticket needs an investigation
      engine: decide
      inputs: { category: "enum[billing, technical, account]", urgency: "enum[low, medium, high]", subject: str, body: str }
      outputs: { route: "enum[investigate, store]" }
      budget: { timeout: 20s, retry: { attempts: 2 } }
      decide:
        rules:                              # deterministic first: the model is not called on a hit
          - when: category == "technical"
            then: store
          - when: category == "billing" and urgency == "high"
            then: investigate
        model: { ref: triage-classifier, min_confidence: 0.7 }
      routes:
        investigate: investigate
        store: persist
        low_confidence: investigate        # unsure → let the investigator look
        error: END.failed                  # covers a model outage: never a silent fallback

    - id: investigate
      description: Investigate a billing issue and resolve it if possible
      engine: loop
      inputs: { customer_id: str, subject: str, body: str }
      outputs: { resolution: str }
      budget: { max_iterations: 6, max_tokens: 20000, max_tool_calls: 4, timeout: 3m }
      loop:
        model: default
        steering: artifact://investigator-steering@2
        tools:
          - agent: lookup_account
          - workflow: issue_credit
            approval: { when: "args.amount > 50", required_group: team_leads }
            max_calls: 1
        supervisor:
          rules:
            - { when: tool_repeated, count: 3, then: abort }
      guardrails: { output: [artifact://no-secrets@1] }
      routes:
        resolved: persist
        needs_human: persist
        max_iterations: persist
        budget_exceeded: persist
        timeout: persist
        aborted: persist
        guardrail_violation: persist
        error: END.failed

    - id: lookup_account
      description: Look up a customer's billing account (plan, balance due, dispute flag) by customer_id
      engine: code
      effect: read
      code: { run: lookup_account }
      inputs: { customer_id: str }
      outputs: { account: json }
      routes: { default: END }

    - id: persist
      description: Save the triaged ticket
      engine: tool
      inputs:
        subject: str
        body: str
        category: "enum[billing, technical, account]"
        urgency: "enum[low, medium, high]"
        resolution: str?
      outputs: { ticket: SupportTicket }
      tool:
        use: db
        model: SupportTicket
        op: create
        values:
          subject: "{{ subject }}"
          body: "{{ body }}"
          category: "{{ category }}"
          urgency: "{{ urgency }}"
          resolution: "{{ resolution }}"
      routes:
        default: END
        conflict: END.failed
        error: END.failed

  outputs:
    default:
      status: 201
      body:
        ticket_id: "{{ ticket.id }}"
        category: "{{ ticket.category }}"
        urgency: "{{ ticket.urgency }}"
        resolution: "{{ ticket.resolution }}"
    failed:
      status: 502
      body: { error: the ticket could not be triaged }
