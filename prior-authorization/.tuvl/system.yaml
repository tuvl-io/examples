# tuvl system configuration
# Generated by `tuvl init`. Do not edit deployment_mode after first boot
# — the database lock takes precedence and a mismatch will crash startup.
#
# deployment_mode:
#   single_tenant  — all data shared in a single schema (default)
#   multi_tenant   — tenant_id column injected into every model;
#                    Row-Level Security policies enforced per request
kind: SystemConfig
version: v1
metadata:
  name: system
spec:
  deployment_mode: single_tenant
  # api:
  #   # Set false to not mount the /models/* CRUD API — only workflow
  #   # routes are exposed. Restart required; the env var
  #   # TUVL_EXPOSE_MODEL_CRUD overrides this value when set.
  #   expose_model_crud: true
  #   # Browser origins allowed to call the API (scheme://host[:port], no trailing
  #   # slash). None by default; TUVL_CORS_ORIGINS overrides.
  #   cors_origins: []
