kind: ModelDefinition
enabled: true
metadata:
  name: PolicyVersion
  schema_version: v1
  description: 'PolicyVersion, from the spec''s # Data. One coverage policy for a procedure, as data.'
spec:
  tablename: policy_versions
  api:
    crud: [list, read]
  fields:
  - name: id
    type: uuid
    primary_key: true
    default: uuid4
    input: false
  - name: procedure_code
    type: string
    required: true
    index: true
  - name: version
    type: string
    required: true
  - name: source_ref
    type: string
    required: true
  - name: status
    type: enum
    enum_values:
    - active
    - retired
    required: true
    default: active
  - name: criteria
    type: jsonb
    required: true
  - name: created_at
    type: timestamptz
    input: false
